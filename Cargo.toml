[package]
name = "fuckinggen"
version = "0.1.7"
edition = "2024"
description = "Generate images through your ChatGPT subscription from the terminal"
license = "WTFPL"

[[bin]]
name = "fuckinggen"
path = "src/main.rs"

[[bin]]
name = "fgen"
path = "src/bin/fgen.rs"

[lib]
name = "fuckinggen"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
crossterm = "0.29"
image = "0.25"
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.16"

[profile.release]
strip = true
lto = "thin"
