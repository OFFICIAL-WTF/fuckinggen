name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.1.2

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            cross: false
          - os: macos-14
            target: x86_64-apple-darwin
            platform: macos-x86_64
            cross: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            cross: false
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            cross: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          root="fuckinggen-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$root"
          cp "target/${{ matrix.target }}/release/fgen" "dist/$root/"
          cp "target/${{ matrix.target }}/release/fuckinggen" "dist/$root/"
          cp README.md LICENSE "dist/$root/"
          tar -czf "dist/$root.tar.gz" -C dist "$root"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "fuckinggen-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$root" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fgen.exe" "dist/$root/"
          Copy-Item "target/${{ matrix.target }}/release/fuckinggen.exe" "dist/$root/"
          Copy-Item README.md, LICENSE "dist/$root/"
          New-Item -ItemType Directory -Force -Path "dist/$root/skills/gpt-image-gen-latest" | Out-Null
          Copy-Item "skills/gpt-image-gen-latest/SKILL.md" "dist/$root/skills/gpt-image-gen-latest/"
          Compress-Archive -Path "dist/$root" -DestinationPath "dist/$root.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release and notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
